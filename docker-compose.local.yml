services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotelcheck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotelcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/hotelcheck?sslmode=disable
      PORT: ${PORT:-8080}
      GIN_MODE: ${GIN_MODE:-release}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
